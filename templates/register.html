<!DOCTYPE html>

<html>

<head>


<title>Register - LifeAid</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="container mt-5">


<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card p-4">

            <h2 class="text-center mb-4">
                🚑 User Registration
            </h2>

            <form method="POST">

                <label>Name</label>
                <input type="text"
                name="name"
                class="form-control mb-3"
                required>

                <label>Email</label>
                <input type="email"
                name="email"
                class="form-control mb-3"
                required>

                <label>Password</label>
                <input type="password"
                name="password"
                class="form-control mb-3"
                required>

                <label>City</label>
                <input type="text"
                name="city"
                class="form-control mb-3"
                required>

                <label>Language</label>

                <select
                name="language"
                class="form-select mb-3">

                    <option>English</option>
                    <option>Hindi</option>
                    <option>Urdu</option>
                    <option>Gujarati</option>
                    <option>Marathi</option>
                    <option>Punjabi</option>
                    <option>Bengali</option>
                    <option>Tamil</option>
                    <option>Telugu</option>

                </select>

                <button
                type="submit"
                class="btn btn-success w-100">

                    Register

                </button>

            </form>

            <hr>

            <p class="text-center">

                Already Registered?

                <a href="/login">
                    Login Here
                </a>

            </p>

        </div>

    </div>

</div>


</div>
<footer class="text-center mt-5 mb-3">

    <hr>

    <p>
        © 2026 LifeAid | Developed by Himani Agrawal
    </p>

</footer>

<!-- LifeAid website-wide language support -->
<div id="google_translate_element" style="display:none"></div>
<style>
  .goog-te-banner-frame, .skiptranslate { display: none !important; }
  body { top: 0 !important; }
  #google_translate_element { display: none !important; }
</style>
<script>
(function () {
  const supported = ['en','hi','ur','gu','mr','pa','bn','ta','te'];
  const languageNames = {en:'English', hi:'Hindi', ur:'Urdu', gu:'Gujarati', mr:'Marathi', pa:'Punjabi', bn:'Bengali', ta:'Tamil', te:'Telugu'};
  function getSavedLanguage() {
    try { return localStorage.getItem('lifeaid_language') || 'en'; } catch (e) { return 'en'; }
  }
  function applyLanguage() {
    const lang = getSavedLanguage();
    const combo = document.querySelector('.goog-te-combo');
    if (combo && supported.includes(lang) && combo.value !== lang) {
      combo.value = lang;
      combo.dispatchEvent(new Event('change'));
    }
    const picker = document.getElementById('preferred_language');
    if (picker) picker.value = lang;
  }
  window.googleTranslateElementInit = function () {
    new google.translate.TranslateElement({pageLanguage:'en', includedLanguages:'en,hi,ur,gu,mr,pa,bn,ta,te', autoDisplay:false}, 'google_translate_element');
    let tries = 0;
    const timer = setInterval(function () {
      applyLanguage();
      tries++;
      if (document.querySelector('.goog-te-combo') || tries > 30) clearInterval(timer);
    }, 300);
  };
  document.addEventListener('DOMContentLoaded', function () {
    const picker = document.getElementById('preferred_language');
    if (picker) {
      picker.value = getSavedLanguage();
      picker.addEventListener('change', function () {
        try { localStorage.setItem('lifeaid_language', picker.value); } catch (e) {}
        applyLanguage();
      });
      const form = picker.closest('form');
      if (form) form.addEventListener('submit', function () {
        try { localStorage.setItem('lifeaid_language', picker.value); } catch (e) {}
      });
    }
    applyLanguage();
  });
  const script = document.createElement('script');
  script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  script.async = true;
  document.head.appendChild(script);
})();
</script>

</body>

</html>
